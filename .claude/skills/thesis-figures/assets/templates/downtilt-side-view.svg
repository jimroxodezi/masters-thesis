<line x1="57.75" y1="108" x2="77.5" y2="148" stroke="var(--s)" stroke-width="1.5"/>
<line x1="77.5" y1="148" x2="51.25" y2="188" stroke="var(--s)" stroke-width="1.5"/>
<line x1="54.5" y1="148" x2="80.75" y2="188" stroke="var(--s)" stroke-width="1.5"/>
