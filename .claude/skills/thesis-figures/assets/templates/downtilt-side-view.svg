<svg width="100%" viewBox="0 0 380 270" role="img"><title>Base station side view with downtilt</title><desc>A tower with a tilted antenna panel sending a beam down to the ground, with a weak-signal spot near the tower and a strong-signal spot inside the beam.</desc>
