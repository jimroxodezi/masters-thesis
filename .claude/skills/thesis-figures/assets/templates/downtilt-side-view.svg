<line x1="76" y1="70" x2="340" y2="126.1" stroke="#1D9E75" stroke-width="1.5"/>
<line x1="76" y1="70" x2="278.2" y2="228" stroke="#1D9E75" stroke-width="1.5"/>
<line x1="76" y1="70" x2="340" y2="193.1" stroke="#1D9E75" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="76" y1="70" x2="250" y2="70" stroke="var(--t)" stroke-width="1" stroke-dasharray="3 4"/>
<path d="M136 70 A60 60 0 0 1 130.4 95.4" fill="none" stroke="var(--s)" stroke-width="1.5"/>
<line x1="150" y1="50" x2="134" y2="82" class="leader"/>
