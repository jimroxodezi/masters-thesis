<svg width="100%" viewBox="0 0 680 540" role="img"><title>LTE network architecture</title><desc>User equipment connects over radio to an eNodeB, which connects to the evolved packet core and then the internet.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="250" y="30" width="180" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">User equipment (UE)</text></g>
<line x1="340" y1="74" x2="340" y2="104" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="354" y="90" dominant-baseline="central">LTE-Uu radio link</text>
<g class="c-teal"><rect x="250" y="106" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="124" text-anchor="middle" dominant-baseline="central">eNodeB</text><text class="ts" x="340" y="144" text-anchor="middle" dominant-baseline="central">Radio base station</text></g>
<line x1="340" y1="162" x2="340" y2="198" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="354" y="180" dominant-baseline="central">S1 interface</text>
<g class="c-purple"><rect x="100" y="200" width="480" height="240" rx="16" stroke-width="0.5"/><text class="th" x="340" y="224" text-anchor="middle" dominant-baseline="central">Evolved packet core (EPC)</text></g>
<rect class="box" x="130" y="248" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="220" y="266" text-anchor="middle" dominant-baseline="central">MME</text>
<text class="ts" x="220" y="286" text-anchor="middle" dominant-baseline="central">Control, mobility</text>
<rect class="box" x="370" y="248" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="460" y="266" text-anchor="middle" dominant-baseline="central">HSS</text>
<text class="ts" x="460" y="286" text-anchor="middle" dominant-baseline="central">Subscriber database</text>
<rect class="box" x="130" y="344" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="220" y="362" text-anchor="middle" dominant-baseline="central">S-GW</text>
<text class="ts" x="220" y="382" text-anchor="middle" dominant-baseline="central">User-plane anchor</text>
<rect class="box" x="370" y="344" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="460" y="362" text-anchor="middle" dominant-baseline="central">P-GW</text>
<text class="ts" x="460" y="382" text-anchor="middle" dominant-baseline="central">IP gateway</text>
<line x1="310" y1="276" x2="368" y2="276" class="arr" marker-end="url(#arrow)"/>
<line x1="220" y1="304" x2="220" y2="342" class="arr" marker-end="url(#arrow)"/>
<line x1="310" y1="372" x2="368" y2="372" class="arr" marker-end="url(#arrow)"/>
<line x1="460" y1="440" x2="460" y2="474" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="474" y="458" dominant-baseline="central">SGi</text>
<g class="c-gray"><rect x="370" y="476" width="180" height="44" rx="8" stroke-width="0.5"/><text class="th" x="460" y="498" text-anchor="middle" dominant-baseline="central">Internet / IMS</text></g>
</svg>
