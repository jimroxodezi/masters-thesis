<svg width="100%" viewBox="0 0 680 200" role="img"><title>Construction of the controlled-SNR test set</title><desc>An active frame from Class C is scaled by alpha and added to an idle frame from Class B of the same session; the mixture is labelled occupied and its effective SNR stored.</desc>
<!-- Design: notes/method-design.md section 6. -->
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="10" y="20" width="190" height="56" rx="4" stroke-width="0.5"/><text class="th" x="105" y="39" text-anchor="middle" dominant-baseline="central">Active frame c</text><text class="ts" x="105" y="59" text-anchor="middle" dominant-baseline="central">Class C, test session</text></g>
<g class="c-gray"><rect x="10" y="124" width="190" height="56" rx="4" stroke-width="0.5"/><text class="th" x="105" y="143" text-anchor="middle" dominant-baseline="central">Idle frame b</text><text class="ts" x="105" y="163" text-anchor="middle" dominant-baseline="central">Class B, same session</text></g>
<g class="c-purple"><circle cx="270" cy="48" r="22" stroke-width="0.8"/><text class="th" x="270" y="48" text-anchor="middle" dominant-baseline="central" style="font-family:'Latin Modern Math'">× 𝛼</text></g>
<line x1="200" y1="48" x2="246" y2="48" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><circle cx="340" cy="100" r="20" stroke-width="0.8"/><text class="th" x="340" y="100" text-anchor="middle" dominant-baseline="central">+</text></g>
<path d="M292 48 L340 48 L340 78" class="arr" marker-end="url(#arrow)"/>
<path d="M200 152 L340 152 L340 122" class="arr" marker-end="url(#arrow)"/>
<line x1="360" y1="100" x2="408" y2="100" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="410" y="66" width="260" height="68" rx="4" stroke-width="0.5"/><text class="th" x="540" y="86" text-anchor="middle" dominant-baseline="central">Mixture, labelled occupied</text><text class="ts" x="540" y="106" text-anchor="middle" dominant-baseline="central">target SNR from −20 to +10 dB</text><text class="ts" x="540" y="122" text-anchor="middle" dominant-baseline="central">effective SNR stored</text></g>
<text class="ts" x="270" y="86" text-anchor="middle" dominant-baseline="central">scaled to the</text><text class="ts" x="270" y="102" text-anchor="middle" dominant-baseline="central">target SNR</text>
</svg>
