<svg width="100%" viewBox="0 0 680 190" role="img"><title>Real-time demonstration</title><desc>The receiver streams samples to the laptop, which reads one frame at a time, removes the DC offset, computes the spectrogram, scores the frame with the calibrated detector and logs the decision; a live view is optional.</desc>
<!-- Design: notes/method-design.md section 11. -->
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="10" y="40" width="120" height="60" rx="4" stroke-width="0.5"/><text class="th" x="70" y="60" text-anchor="middle" dominant-baseline="central">RTL-SDR V4</text><text class="ts" x="70" y="80" text-anchor="middle" dominant-baseline="central">1.92 MS/s stream</text></g>
<g class="c-teal"><rect x="150" y="40" width="120" height="60" rx="4" stroke-width="0.5"/><text class="th" x="210" y="60" text-anchor="middle" dominant-baseline="central">Read frame</text><text class="ts" x="210" y="80" text-anchor="middle" dominant-baseline="central">16 384 samples</text></g>
<g class="c-teal"><rect x="290" y="40" width="120" height="60" rx="4" stroke-width="0.5"/><text class="th" x="350" y="60" text-anchor="middle" dominant-baseline="central">Preprocess</text><text class="ts" x="350" y="80" text-anchor="middle" dominant-baseline="central">DC, spectrogram</text></g>
<g class="c-purple"><rect x="430" y="40" width="120" height="60" rx="4" stroke-width="0.5"/><text class="th" x="490" y="60" text-anchor="middle" dominant-baseline="central">Detector</text><text class="ts" x="490" y="80" text-anchor="middle" dominant-baseline="central">score vs threshold</text></g>
<g class="c-coral"><rect x="570" y="20" width="100" height="44" rx="4" stroke-width="0.5"/><text class="th" x="620" y="34" text-anchor="middle" dominant-baseline="central">Log</text><text class="ts" x="620" y="52" text-anchor="middle" dominant-baseline="central">CSV per frame</text></g>
<g class="c-coral"><rect x="570" y="80" width="100" height="44" rx="4" stroke-width="0.5" style="stroke-dasharray:5 3"/><text class="th" x="620" y="94" text-anchor="middle" dominant-baseline="central">Live view</text><text class="ts" x="620" y="112" text-anchor="middle" dominant-baseline="central">optional</text></g>
<line x1="130" y1="70" x2="148" y2="70" class="arr" marker-end="url(#arrow)"/><line x1="270" y1="70" x2="288" y2="70" class="arr" marker-end="url(#arrow)"/><line x1="410" y1="70" x2="428" y2="70" class="arr" marker-end="url(#arrow)"/>
<path d="M550 60 L560 60 L560 42 L568 42" class="arr" marker-end="url(#arrow)"/><path d="M550 80 L560 80 L560 102 L568 102" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="150" text-anchor="middle" dominant-baseline="central">Logged per frame: UTC time, centre frequency, gain, score, decision, processing time</text>
</svg>
