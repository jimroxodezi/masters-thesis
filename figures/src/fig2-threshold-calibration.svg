<svg width="100%" viewBox="0 0 680 290" role="img"><title>Threshold calibration on idle validation data</title><desc>Step 1: a detector is fitted on idle training frames only. Step 2: it scores held-out idle validation frames, and the threshold is placed so that the target false-alarm rate of their scores lies above it. Step 3: test frames whose score exceeds the threshold are declared occupied. The distribution is a sketch, not data.</desc>
<!-- Concept: empirical thresholds from score distributions (Ruff et al., 2021); procedure of this study (Chapter 3). The curve is a schematic, not data. -->
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="110" y="16" text-anchor="middle" dominant-baseline="central">1. Train</text>
<text class="th" x="340" y="16" text-anchor="middle" dominant-baseline="central">2. Calibrate</text>
<text class="th" x="570" y="16" text-anchor="middle" dominant-baseline="central">3. Test</text>
<!-- column 1 -->
<g class="c-gray"><rect x="20" y="34" width="180" height="52" rx="4" stroke-width="0.5"/><text class="th" x="110" y="51" text-anchor="middle" dominant-baseline="central">Idle training frames</text><text class="ts" x="110" y="70" text-anchor="middle" dominant-baseline="central">captured and screened</text></g>
<line x1="110" y1="86" x2="110" y2="116" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="20" y="118" width="180" height="52" rx="4" stroke-width="0.5"/><text class="th" x="110" y="135" text-anchor="middle" dominant-baseline="central">Fit the detector</text><text class="ts" x="110" y="154" text-anchor="middle" dominant-baseline="central">e.g. autoencoder or PCA</text></g>
<!-- column 2 -->
<g class="c-gray"><rect x="250" y="34" width="180" height="52" rx="4" stroke-width="0.5"/><text class="th" x="340" y="51" text-anchor="middle" dominant-baseline="central">Idle validation frames</text><text class="ts" x="340" y="70" text-anchor="middle" dominant-baseline="central">held out from training</text></g>
<line x1="200" y1="144" x2="248" y2="144" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="224" y="132" text-anchor="middle" dominant-baseline="central">scores</text>
<!-- schematic score distribution -->
<path d="M262 206 C285 206 296 122 318 120 C342 118 356 180 420 203 L420 206 Z" style="fill:#EEEDFE;stroke:#534AB7;stroke-width:1"/>
<path d="M378.00 177.94 C389.15 187.78 402.76 196.81 420.00 203.00 L420 206 L378.00 206 Z" style="fill:#F0997B;stroke:none"/>
<line x1="258" y1="206" x2="428" y2="206" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="428" y="220" text-anchor="end" dominant-baseline="central">score</text>
<line x1="378" y1="104" x2="378" y2="210" style="stroke:#2C2C2A;stroke-width:1.2;stroke-dasharray:5 3"/>
<text class="ts" x="378" y="96" text-anchor="middle" dominant-baseline="central">threshold</text>
<line x1="340" y1="86" x2="340" y2="112" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="240" text-anchor="middle" dominant-baseline="central">Shaded tail = target false-alarm</text>
<text class="ts" x="340" y="256" text-anchor="middle" dominant-baseline="central">rate (1% or 5%) of idle scores</text>
<!-- column 3 -->
<g class="c-gray"><rect x="480" y="34" width="180" height="52" rx="4" stroke-width="0.5"/><text class="th" x="570" y="51" text-anchor="middle" dominant-baseline="central">Test frames</text><text class="ts" x="570" y="70" text-anchor="middle" dominant-baseline="central">idle and LTE-active</text></g>
<line x1="570" y1="86" x2="570" y2="116" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="480" y="118" width="180" height="52" rx="4" stroke-width="0.5"/><text class="th" x="570" y="135" text-anchor="middle" dominant-baseline="central">Compare</text><text class="ts" x="570" y="154" text-anchor="middle" dominant-baseline="central">score above threshold?</text></g>
<line x1="430" y1="144" x2="478" y2="144" class="arr" marker-end="url(#arrow)"/>
<line x1="570" y1="170" x2="570" y2="196" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="570" y="212" text-anchor="middle" dominant-baseline="central">Yes: occupied</text>
<text class="ts" x="570" y="230" text-anchor="middle" dominant-baseline="central">No: idle</text>
</svg>
