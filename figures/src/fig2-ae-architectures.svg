<svg width="100%" viewBox="0 0 680 300" role="img"><title>Fully connected and convolutional autoencoders</title><desc>Top: a 64 x 64 spectrogram is flattened to 4096 values and passed through dense layers to a code and back. Bottom: convolutional layers with 3 x 3 kernels and downsampling produce code feature maps, and upsampling with convolutions reconstructs the spectrogram. First-layer parameter counts: 1,048,832 (dense, 256 units) and 320 (32 kernels of 3 x 3).</desc>
<!-- Sources: Goodfellow et al. (2016, pp. 329-334) for sparse interactions and parameter sharing; Masci et al. (2011, p. 54) for convolutional autoencoders. Layer sizes are illustrative, not the architectures of this study. Adapted from the skill template conv-autoencoder.svg. -->
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<!-- (a) fully connected -->
<text class="th" x="12" y="18" dominant-baseline="central">(a) Fully connected</text>
<g class="c-gray"><rect x="12" y="34" width="80" height="52" rx="4" stroke-width="0.5"/><text class="th" x="52" y="51" text-anchor="middle" dominant-baseline="central">Input</text><text class="ts" x="52" y="70" text-anchor="middle" dominant-baseline="central">64 × 64</text></g>
<g class="c-teal"><rect x="108" y="34" width="80" height="52" rx="4" stroke-width="0.5"/><text class="th" x="148" y="51" text-anchor="middle" dominant-baseline="central">Flatten</text><text class="ts" x="148" y="70" text-anchor="middle" dominant-baseline="central">4096 values</text></g>
<g class="c-teal"><rect x="204" y="34" width="80" height="52" rx="4" stroke-width="0.5"/><text class="th" x="244" y="51" text-anchor="middle" dominant-baseline="central">Dense</text><text class="ts" x="244" y="70" text-anchor="middle" dominant-baseline="central">256 units</text></g>
<g class="c-coral"><rect x="300" y="34" width="80" height="52" rx="4" stroke-width="0.5"/><text class="th" x="340" y="51" text-anchor="middle" dominant-baseline="central">Code</text><text class="ts" x="340" y="70" text-anchor="middle" dominant-baseline="central">small vector</text></g>
<g class="c-purple"><rect x="396" y="34" width="80" height="52" rx="4" stroke-width="0.5"/><text class="th" x="436" y="51" text-anchor="middle" dominant-baseline="central">Dense</text><text class="ts" x="436" y="70" text-anchor="middle" dominant-baseline="central">256 units</text></g>
<g class="c-purple"><rect x="492" y="34" width="80" height="52" rx="4" stroke-width="0.5"/><text class="th" x="532" y="51" text-anchor="middle" dominant-baseline="central">Dense</text><text class="ts" x="532" y="70" text-anchor="middle" dominant-baseline="central">4096 values</text></g>
<g class="c-gray"><rect x="588" y="34" width="80" height="52" rx="4" stroke-width="0.5"/><text class="th" x="628" y="51" text-anchor="middle" dominant-baseline="central">Output</text><text class="ts" x="628" y="70" text-anchor="middle" dominant-baseline="central">64 × 64</text></g>
<line x1="92" y1="60" x2="106" y2="60" class="arr" marker-end="url(#arrow)"/><line x1="188" y1="60" x2="202" y2="60" class="arr" marker-end="url(#arrow)"/><line x1="284" y1="60" x2="298" y2="60" class="arr" marker-end="url(#arrow)"/><line x1="380" y1="60" x2="394" y2="60" class="arr" marker-end="url(#arrow)"/><line x1="476" y1="60" x2="490" y2="60" class="arr" marker-end="url(#arrow)"/><line x1="572" y1="60" x2="586" y2="60" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="106" text-anchor="middle" dominant-baseline="central">First dense layer: 4096 × 256 + 256 = 1,048,832 parameters; every unit sees the whole input</text>
<!-- (b) convolutional -->
<text class="th" x="12" y="140" dominant-baseline="central">(b) Convolutional</text>
<g class="c-gray"><rect x="12" y="156" width="80" height="52" rx="4" stroke-width="0.5"/><text class="th" x="52" y="173" text-anchor="middle" dominant-baseline="central">Input</text><text class="ts" x="52" y="192" text-anchor="middle" dominant-baseline="central">64 × 64</text></g>
<g class="c-teal"><rect x="108" y="156" width="80" height="52" rx="4" stroke-width="0.5"/><text class="th" x="148" y="173" text-anchor="middle" dominant-baseline="central">Conv</text><text class="ts" x="148" y="192" text-anchor="middle" dominant-baseline="central">32 maps</text></g>
<g class="c-teal"><rect x="204" y="156" width="80" height="52" rx="4" stroke-width="0.5"/><text class="th" x="244" y="173" text-anchor="middle" dominant-baseline="central">Pool</text><text class="ts" x="244" y="192" text-anchor="middle" dominant-baseline="central">downsample</text></g>
<g class="c-coral"><rect x="300" y="156" width="80" height="52" rx="4" stroke-width="0.5"/><text class="th" x="340" y="173" text-anchor="middle" dominant-baseline="central">Code</text><text class="ts" x="340" y="192" text-anchor="middle" dominant-baseline="central">feature maps</text></g>
<g class="c-purple"><rect x="396" y="156" width="80" height="52" rx="4" stroke-width="0.5"/><text class="th" x="436" y="173" text-anchor="middle" dominant-baseline="central">Upsample</text><text class="ts" x="436" y="192" text-anchor="middle" dominant-baseline="central">enlarge maps</text></g>
<g class="c-purple"><rect x="492" y="156" width="80" height="52" rx="4" stroke-width="0.5"/><text class="th" x="532" y="173" text-anchor="middle" dominant-baseline="central">Conv</text><text class="ts" x="532" y="192" text-anchor="middle" dominant-baseline="central">1 map</text></g>
<g class="c-gray"><rect x="588" y="156" width="80" height="52" rx="4" stroke-width="0.5"/><text class="th" x="628" y="173" text-anchor="middle" dominant-baseline="central">Output</text><text class="ts" x="628" y="192" text-anchor="middle" dominant-baseline="central">64 × 64</text></g>
<line x1="92" y1="182" x2="106" y2="182" class="arr" marker-end="url(#arrow)"/><line x1="188" y1="182" x2="202" y2="182" class="arr" marker-end="url(#arrow)"/><line x1="284" y1="182" x2="298" y2="182" class="arr" marker-end="url(#arrow)"/><line x1="380" y1="182" x2="394" y2="182" class="arr" marker-end="url(#arrow)"/><line x1="476" y1="182" x2="490" y2="182" class="arr" marker-end="url(#arrow)"/><line x1="572" y1="182" x2="586" y2="182" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="228" text-anchor="middle" dominant-baseline="central">First convolutional layer (3 × 3 kernels): 32 × 9 + 32 = 320 parameters; each unit sees a 3 × 3 patch, weights shared</text>
<!-- legend -->
<g class="c-teal"><rect x="150" y="262" width="26" height="16" stroke-width="0.5"/></g><text class="ts" x="184" y="270" dominant-baseline="central">Encoder</text>
<g class="c-coral"><rect x="290" y="262" width="26" height="16" stroke-width="0.5"/></g><text class="ts" x="324" y="270" dominant-baseline="central">Code</text>
<g class="c-purple"><rect x="410" y="262" width="26" height="16" stroke-width="0.5"/></g><text class="ts" x="444" y="270" dominant-baseline="central">Decoder</text>
</svg>
