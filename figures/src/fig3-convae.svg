<svg width="100%" viewBox="0 0 680 260" role="img"><title>Convolutional autoencoder</title><desc>Encoder: three 3x3 convolution stages with 16, 32 and 64 channels and max-pooling, then a 1x1 convolution to an 8 x 16 x 16 code. Decoder: 1x1 convolution back to 64 channels and three upsampling and convolution stages to a 1 x 128 x 128 output.</desc>
<!-- Design: notes/method-design.md section 7.1 (stages 16/32/64 from the author's original model; 1x1 bottleneck to 8 channels, provisional). Decoder sizes follow the original model's decoder with the added 1x1 layer; check against code/occupancy/models.py. Red = provisional. -->
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="10" y="16" dominant-baseline="central">Encoder</text>
<g class="c-gray"><rect x="10" y="30" width="88" height="56" rx="4" stroke-width="0.5"/><text class="th" x="54" y="48" text-anchor="middle" dominant-baseline="central">Input</text><text class="ts" x="54" y="68" text-anchor="middle" dominant-baseline="central">1 × 128 × 128</text></g>
<g class="c-teal"><rect x="114" y="30" width="96" height="56" rx="4" stroke-width="0.5"/><text class="th" x="162" y="48" text-anchor="middle" dominant-baseline="central">Conv, pool</text><text class="ts" x="162" y="68" text-anchor="middle" dominant-baseline="central">16 × 64 × 64</text></g>
<g class="c-teal"><rect x="226" y="30" width="96" height="56" rx="4" stroke-width="0.5"/><text class="th" x="274" y="48" text-anchor="middle" dominant-baseline="central">Conv, pool</text><text class="ts" x="274" y="68" text-anchor="middle" dominant-baseline="central">32 × 32 × 32</text></g>
<g class="c-teal"><rect x="338" y="30" width="96" height="56" rx="4" stroke-width="0.5"/><text class="th" x="386" y="48" text-anchor="middle" dominant-baseline="central">Conv, pool</text><text class="ts" x="386" y="68" text-anchor="middle" dominant-baseline="central">64 × 16 × 16</text></g>
<g class="c-coral"><rect x="450" y="30" width="110" height="56" rx="4" stroke-width="0.5"/><text class="th" x="505" y="48" text-anchor="middle" dominant-baseline="central">1 × 1 conv</text><text class="ts" x="505" y="68" text-anchor="middle" dominant-baseline="central" style="fill:#C0392B">8 × 16 × 16</text></g>
<line x1="98" y1="58" x2="112" y2="58" class="arr" marker-end="url(#arrow)"/><line x1="210" y1="58" x2="224" y2="58" class="arr" marker-end="url(#arrow)"/><line x1="322" y1="58" x2="336" y2="58" class="arr" marker-end="url(#arrow)"/><line x1="434" y1="58" x2="448" y2="58" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="600" y="50" dominant-baseline="central">Code:</text><text class="ts" x="600" y="66" dominant-baseline="central" style="fill:#C0392B">2048 values</text>
<path d="M505 86 L505 112 L620 112 L620 138" class="arr" marker-end="url(#arrow)"/>
<text class="th" x="10" y="124" dominant-baseline="central">Decoder</text>
<g class="c-purple"><rect x="560" y="140" width="110" height="56" rx="4" stroke-width="0.5"/><text class="th" x="615" y="158" text-anchor="middle" dominant-baseline="central">1 × 1 conv</text><text class="ts" x="615" y="178" text-anchor="middle" dominant-baseline="central">64 × 16 × 16</text></g>
<g class="c-purple"><rect x="448" y="140" width="96" height="56" rx="4" stroke-width="0.5"/><text class="th" x="496" y="158" text-anchor="middle" dominant-baseline="central">Up, conv</text><text class="ts" x="496" y="178" text-anchor="middle" dominant-baseline="central">32 × 32 × 32</text></g>
<g class="c-purple"><rect x="336" y="140" width="96" height="56" rx="4" stroke-width="0.5"/><text class="th" x="384" y="158" text-anchor="middle" dominant-baseline="central">Up, conv</text><text class="ts" x="384" y="178" text-anchor="middle" dominant-baseline="central">16 × 64 × 64</text></g>
<g class="c-purple"><rect x="224" y="140" width="96" height="56" rx="4" stroke-width="0.5"/><text class="th" x="272" y="158" text-anchor="middle" dominant-baseline="central">Up, conv</text><text class="ts" x="272" y="178" text-anchor="middle" dominant-baseline="central">1 × 128 × 128</text></g>
<g class="c-gray"><rect x="10" y="140" width="190" height="56" rx="4" stroke-width="0.5"/><text class="th" x="105" y="158" text-anchor="middle" dominant-baseline="central">Reconstruction</text><text class="ts" x="105" y="178" text-anchor="middle" dominant-baseline="central">score: MSE with input</text></g>
<line x1="560" y1="168" x2="546" y2="168" class="arr" marker-end="url(#arrow)"/><line x1="448" y1="168" x2="434" y2="168" class="arr" marker-end="url(#arrow)"/><line x1="336" y1="168" x2="322" y2="168" class="arr" marker-end="url(#arrow)"/><line x1="224" y1="168" x2="202" y2="168" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="222" text-anchor="middle" dominant-baseline="central">Conv: 3 × 3 convolution, batch normalization, ReLU. Pool: 2 × 2 max-pooling. Up: 2 × upsampling.</text>
<text class="ts" x="340" y="240" text-anchor="middle" dominant-baseline="central">The last decoder layer has a linear output. Red sizes are provisional.</text>
</svg>
