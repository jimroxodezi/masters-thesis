<g class="c-coral"><rect x="180" y="126" width="150" height="62" rx="4" stroke-width="0.5"/><text class="th" x="255" y="146" text-anchor="middle" dominant-baseline="central">Test scoring</text><text class="ts" x="255" y="166" text-anchor="middle" dominant-baseline="central">sessions, SNR set</text></g>
<g class="c-coral"><rect x="350" y="126" width="150" height="62" rx="4" stroke-width="0.5"/><text class="th" x="425" y="146" text-anchor="middle" dominant-baseline="central">Evaluation</text><text class="ts" x="425" y="166" text-anchor="middle" dominant-baseline="central">bootstrap over sessions</text></g>
<g class="c-coral"><rect x="520" y="126" width="150" height="62" rx="4" stroke-width="0.5"/><text class="th" x="595" y="146" text-anchor="middle" dominant-baseline="central">Cost and demo</text><text class="ts" x="595" y="166" text-anchor="middle" dominant-baseline="central">on the laptop CPU</text></g>
