<svg width="100%" viewBox="0 0 680 210" role="img"><title>Overview of the method</title><desc>Capture sessions, framing and spectrograms, session-level folds and seven detectors in the first row; threshold calibration, test scoring, evaluation and cost measurement in the second.</desc>
<!-- Method overview; design in notes/method-design.md. -->
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="10" y="20" width="150" height="62" rx="4" stroke-width="0.5"/><text class="th" x="85" y="40" text-anchor="middle" dominant-baseline="central">Capture sessions</text><text class="ts" x="85" y="60" text-anchor="middle" dominant-baseline="central">Classes A, B, C at g1, g2</text></g>
<g class="c-teal"><rect x="180" y="20" width="150" height="62" rx="4" stroke-width="0.5"/><text class="th" x="255" y="40" text-anchor="middle" dominant-baseline="central">Frames</text><text class="ts" x="255" y="60" text-anchor="middle" dominant-baseline="central">IQ and spectrograms</text></g>
<g class="c-teal"><rect x="350" y="20" width="150" height="62" rx="4" stroke-width="0.5"/><text class="th" x="425" y="40" text-anchor="middle" dominant-baseline="central">Session folds</text><text class="ts" x="425" y="60" text-anchor="middle" dominant-baseline="central">train, validation, test</text></g>
<g class="c-purple"><rect x="520" y="20" width="150" height="62" rx="4" stroke-width="0.5"/><text class="th" x="595" y="40" text-anchor="middle" dominant-baseline="central">Seven detectors</text><text class="ts" x="595" y="60" text-anchor="middle" dominant-baseline="central">same frames for all</text></g>
<line x1="160" y1="51" x2="178" y2="51" class="arr" marker-end="url(#arrow)"/><line x1="330" y1="51" x2="348" y2="51" class="arr" marker-end="url(#arrow)"/><line x1="500" y1="51" x2="518" y2="51" class="arr" marker-end="url(#arrow)"/>
<path d="M595 82 L595 104 L85 104 L85 124" class="arr" marker-end="url(#arrow)"/>
