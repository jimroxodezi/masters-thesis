<svg width="100%" viewBox="0 0 680 300" role="img"><title>Frame and spectrogram geometry</title><desc>LTE synchronization signals recur every 5 ms; a frame of 16384 samples (8.533 ms) always contains at least one PSS and SSS. Each frame is cut into 128 segments of 128 samples, giving a 128 by 128 spectrogram with 15 kHz bins and 66.7 microsecond columns.</desc>
<!-- Scale 36 px/ms, t = 0 at x = 60. SSS and PSS occupy the last two OFDM symbols of slots 0 and 10 (about 0.36-0.50 ms and 5.36-5.50 ms into each 10 ms frame); drawn as 5 px bars at 0.36, 5.36, 10.36, 15.36 ms. Example frame from 2.0 to 10.533 ms. Source: 3GPP TS 36.211 clauses 4.1, 6.11, 6.12. -->
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="60" y="18" dominant-baseline="central">LTE downlink timing</text>
<line x1="60" y1="60" x2="660" y2="60" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="660" y="46" text-anchor="end" dominant-baseline="central">Time (ms)</text>
<g style="fill:#FAEEDA;stroke:#854F0B;stroke-width:0.8"><rect x="73" y="38" width="5" height="22"/><rect x="253" y="38" width="5" height="22"/><rect x="433" y="38" width="5" height="22"/><rect x="613" y="38" width="5" height="22"/></g>
<text class="ts" x="76" y="30" text-anchor="middle" dominant-baseline="central">SSS, PSS</text><text class="ts" x="256" y="30" text-anchor="middle" dominant-baseline="central">SSS, PSS</text><text class="ts" x="436" y="30" text-anchor="middle" dominant-baseline="central">SSS, PSS</text>
<line x1="60" y1="56" x2="60" y2="64" stroke="#5F5E5A" stroke-width="1"/><text class="ts" x="60" y="76" text-anchor="middle" dominant-baseline="central">0</text>
<line x1="240" y1="56" x2="240" y2="64" stroke="#5F5E5A" stroke-width="1"/><text class="ts" x="240" y="76" text-anchor="middle" dominant-baseline="central">5</text>
<line x1="420" y1="56" x2="420" y2="64" stroke="#5F5E5A" stroke-width="1"/><text class="ts" x="420" y="76" text-anchor="middle" dominant-baseline="central">10</text>
<line x1="600" y1="56" x2="600" y2="64" stroke="#5F5E5A" stroke-width="1"/><text class="ts" x="600" y="76" text-anchor="middle" dominant-baseline="central">15</text>
<g class="c-teal"><rect x="132" y="92" width="307.2" height="30" stroke-width="0.8"/><text class="th" x="285.6" y="107" text-anchor="middle" dominant-baseline="central">Frame: 16 384 samples, 8.533 ms</text></g>
<g class="c-gray"><rect x="439.2" y="92" width="220.8" height="30" stroke-width="0.5"/><text class="ts" x="549.6" y="107" text-anchor="middle" dominant-baseline="central">next frame</text></g>
<line x1="132" y1="122" x2="200" y2="170" class="leader"/><line x1="439.2" y1="122" x2="472" y2="170" class="leader"/>
<g style="fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5">
<rect x="200" y="170" width="17" height="30"/><rect x="217" y="170" width="17" height="30"/><rect x="234" y="170" width="17" height="30"/><rect x="251" y="170" width="17" height="30"/><rect x="268" y="170" width="17" height="30"/><rect x="285" y="170" width="17" height="30"/><rect x="302" y="170" width="17" height="30"/><rect x="319" y="170" width="17" height="30"/><rect x="336" y="170" width="17" height="30"/><rect x="353" y="170" width="17" height="30"/><rect x="370" y="170" width="17" height="30"/><rect x="387" y="170" width="17" height="30"/><rect x="404" y="170" width="17" height="30"/><rect x="421" y="170" width="17" height="30"/><rect x="438" y="170" width="17" height="30"/><rect x="455" y="170" width="17" height="30"/>
</g>
<text class="ts" x="336" y="216" text-anchor="middle" dominant-baseline="central">128 segments of 128 samples (66.7 µs each; first 16 shown)</text>
<line x1="336" y1="226" x2="336" y2="246" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="186" y="250" width="300" height="40" rx="4" stroke-width="0.5"/><text class="th" x="336" y="263" text-anchor="middle" dominant-baseline="central">Spectrogram 128 × 128</text><text class="ts" x="336" y="280" text-anchor="middle" dominant-baseline="central">128 bins of 15 kHz × 128 columns</text></g>
</svg>
