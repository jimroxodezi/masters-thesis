<svg width="100%" viewBox="0 0 680 240" role="img"><title>Capture set-up for the data classes</title><desc>Class A: 50 ohm terminator into the RTL-SDR Blog V4 and laptop. Class B: antenna, receiver tuned to a stretch with no carrier. Class C: antenna, receiver tuned to the carrier, centred or offset. Bias tee off throughout.</desc>
<!-- Design: notes/method-design.md, section 3. -->
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="10" y="45" dominant-baseline="central">A</text>
<g class="c-gray"><rect x="40" y="20" width="170" height="50" rx="4" stroke-width="0.5"/><text class="th" x="125" y="37" text-anchor="middle" dominant-baseline="central">50 Ω terminator</text><text class="ts" x="125" y="55" text-anchor="middle" dominant-baseline="central">no external signal</text></g>
<text class="th" x="10" y="120" dominant-baseline="central">B</text>
<g class="c-gray"><rect x="40" y="95" width="170" height="50" rx="4" stroke-width="0.5"/><text class="th" x="125" y="112" text-anchor="middle" dominant-baseline="central">Antenna</text><text class="ts" x="125" y="130" text-anchor="middle" dominant-baseline="central">window with no carrier</text></g>
<text class="th" x="10" y="195" dominant-baseline="central">C</text>
<g class="c-gray"><rect x="40" y="170" width="170" height="50" rx="4" stroke-width="0.5"/><text class="th" x="125" y="187" text-anchor="middle" dominant-baseline="central">Antenna</text><text class="ts" x="125" y="205" text-anchor="middle" dominant-baseline="central">window on the carrier</text></g>
<g class="c-teal"><rect x="270" y="70" width="170" height="100" rx="4" stroke-width="0.5"/><text class="th" x="355" y="100" text-anchor="middle" dominant-baseline="central">RTL-SDR Blog V4</text><text class="ts" x="355" y="122" text-anchor="middle" dominant-baseline="central">1.92 MS/s, fixed gain</text><text class="ts" x="355" y="140" text-anchor="middle" dominant-baseline="central">bias tee off</text></g>
<path d="M210 45 L240 45 L240 100 L268 100" class="arr" marker-end="url(#arrow)"/>
<line x1="210" y1="120" x2="268" y2="120" class="arr" marker-end="url(#arrow)"/>
<path d="M210 195 L240 195 L240 140 L268 140" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="500" y="70" width="170" height="100" rx="4" stroke-width="0.5"/><text class="th" x="585" y="100" text-anchor="middle" dominant-baseline="central">Host laptop</text><text class="ts" x="585" y="122" text-anchor="middle" dominant-baseline="central">IQ file and</text><text class="ts" x="585" y="140" text-anchor="middle" dominant-baseline="central">metadata record</text></g>
<line x1="440" y1="120" x2="498" y2="120" class="arr" marker-end="url(#arrow)"/><text class="ts" x="469" y="108" text-anchor="middle" dominant-baseline="central">USB</text>
</svg>
