<svg width="100%" viewBox="0 0 680 215" role="img"><title>Energy detector</title><desc>The received signal is filtered to the band of interest, sampled, squared in magnitude and averaged over N samples; the average T is compared with a threshold lambda derived from the noise power and the target false-alarm rate.</desc>
<!-- Sources: Kostylev (2002, p. 1606) for the classical filter-square-integrate structure after Urkowitz (1967); Axell et al. (2010, pp. 322-323) and Yucek and Arslan (2009, p. 121) for the sampled statistic and the threshold. Math in Latin Modern Math text elements (no tspans: cairosvg misplaces them). -->
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="6" y="22" dominant-baseline="central">Received signal</text>
<line x1="2" y1="68" x2="22" y2="68" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="24" y="40" width="90" height="56" rx="4" stroke-width="0.5"/><text class="th" x="69" y="58" text-anchor="middle" dominant-baseline="central">Filter</text><text class="ts" x="69" y="78" text-anchor="middle" dominant-baseline="central">band of interest</text></g>
<line x1="114" y1="68" x2="130" y2="68" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="132" y="40" width="90" height="56" rx="4" stroke-width="0.5"/><text class="th" x="177" y="58" text-anchor="middle" dominant-baseline="central">Sample</text><text class="ts" x="177" y="78" text-anchor="middle" dominant-baseline="central">complex IQ</text></g>
<line x1="222" y1="68" x2="238" y2="68" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="240" y="40" width="90" height="56" rx="4" stroke-width="0.5"/><text class="th" x="285" y="58" text-anchor="middle" dominant-baseline="central">Square</text><text class="ts" x="285" y="78" text-anchor="middle" dominant-baseline="central">magnitude</text></g>
<line x1="330" y1="68" x2="346" y2="68" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="348" y="40" width="90" height="56" rx="4" stroke-width="0.5"/><text class="th" x="393" y="58" text-anchor="middle" dominant-baseline="central">Average</text><text class="ts" x="393" y="78" text-anchor="middle" dominant-baseline="central" style="font-family:'Latin Modern Math'">over 𝑁 samples</text></g>
<line x1="438" y1="68" x2="454" y2="68" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="446" y="54" text-anchor="middle" dominant-baseline="central" style="font-family:'Latin Modern Math'">𝑇</text>
<g class="c-purple"><rect x="456" y="40" width="90" height="56" rx="4" stroke-width="0.5"/><text class="th" x="501" y="58" text-anchor="middle" dominant-baseline="central">Compare</text><text class="ts" x="501" y="78" text-anchor="middle" dominant-baseline="central" style="font-family:'Latin Modern Math'">is 𝑇 &gt; 𝜆 ?</text></g>
<line x1="546" y1="68" x2="562" y2="68" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="566" y="58" dominant-baseline="central">Yes: occupied</text>
<text class="ts" x="566" y="78" dominant-baseline="central">No: idle</text>
<!-- threshold path -->
<g class="c-gray"><rect x="186" y="140" width="190" height="56" rx="4" stroke-width="0.5"/><text class="th" x="281" y="158" text-anchor="middle" dominant-baseline="central">Noise power</text><text class="ts" x="281" y="178" text-anchor="middle" dominant-baseline="central">fixed or adaptive estimate</text></g>
<line x1="376" y1="168" x2="394" y2="168" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="396" y="140" width="210" height="56" rx="4" stroke-width="0.5"/><text class="th" x="501" y="158" text-anchor="middle" dominant-baseline="central">Threshold</text><text class="ts" x="501" y="178" text-anchor="middle" dominant-baseline="central" style="font-family:'Latin Modern Math'">𝜆 for the target false-alarm rate</text></g>
<line x1="501" y1="140" x2="501" y2="98" class="arr" marker-end="url(#arrow)"/>
</svg>
