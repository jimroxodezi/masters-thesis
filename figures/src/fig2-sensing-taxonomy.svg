<svg width="100%" viewBox="0 0 680 410" role="img"><title>Taxonomy of spectrum sensing methods</title><desc>Spectrum sensing divides into non-cooperative, cooperative and learned detection. Non-cooperative methods are grouped by prior knowledge: none (energy detection, eigenvalue-based detection), signal features (cyclostationary and waveform-based detection) and the full waveform (matched filter).</desc>
<!-- Sources: Yucek and Arslan (2009, pp. 120-124); Axell et al. (2010, pp. 322-324); Zeng and Liang (2009, p. 1). Thick teal outline = implemented in this study; grey = reviewed only; dashed = out of scope. -->
<!-- connectors -->
<g style="stroke:#888780;stroke-width:1;fill:none">
<line x1="130" y1="250" x2="140" y2="250"/><line x1="140" y1="149" x2="140" y2="382"/>
<line x1="140" y1="149" x2="160" y2="149"/><line x1="140" y1="322" x2="160" y2="322"/><line x1="140" y1="382" x2="160" y2="382"/>
<line x1="320" y1="149" x2="335" y2="149"/><line x1="335" y1="57" x2="335" y2="232"/>
<line x1="335" y1="57" x2="350" y2="57"/><line x1="335" y1="157" x2="350" y2="157"/><line x1="335" y1="232" x2="350" y2="232"/>
<line x1="490" y1="57" x2="505" y2="57"/><line x1="505" y1="32" x2="505" y2="82"/><line x1="505" y1="32" x2="520" y2="32"/><line x1="505" y1="82" x2="520" y2="82"/>
<line x1="490" y1="157" x2="505" y2="157"/><line x1="505" y1="132" x2="505" y2="182"/><line x1="505" y1="132" x2="520" y2="132"/><line x1="505" y1="182" x2="520" y2="182"/>
<line x1="490" y1="232" x2="520" y2="232"/>
</g>
<!-- root -->
<g class="c-purple"><rect x="10" y="226" width="120" height="48" rx="4" stroke-width="0.5"/><text class="th" x="70" y="241" text-anchor="middle" dominant-baseline="central">Spectrum</text><text class="th" x="70" y="259" text-anchor="middle" dominant-baseline="central">sensing</text></g>
<!-- level 1 -->
<g class="c-purple"><rect x="160" y="127" width="160" height="44" rx="4" stroke-width="0.5"/><text class="th" x="240" y="141" text-anchor="middle" dominant-baseline="central">Non-cooperative</text><text class="ts" x="240" y="159" text-anchor="middle" dominant-baseline="central">one receiver</text></g>
<g class="c-gray"><rect x="160" y="300" width="160" height="44" rx="4" stroke-width="1" style="stroke-dasharray:5 3"/><text class="th" x="240" y="314" text-anchor="middle" dominant-baseline="central">Cooperative</text><text class="ts" x="240" y="332" text-anchor="middle" dominant-baseline="central">several receivers</text></g>
<g class="c-teal"><rect x="160" y="360" width="160" height="44" rx="4" stroke-width="2"/><text class="th" x="240" y="374" text-anchor="middle" dominant-baseline="central">Learned detectors</text><text class="ts" x="240" y="392" text-anchor="middle" dominant-baseline="central">rule learned from data</text></g>
<!-- level 2: prior knowledge -->
<g class="c-purple"><rect x="350" y="35" width="140" height="44" rx="4" stroke-width="0.5"/><text class="th" x="420" y="49" text-anchor="middle" dominant-baseline="central">No knowledge</text><text class="ts" x="420" y="67" text-anchor="middle" dominant-baseline="central">of the signal</text></g>
<g class="c-purple"><rect x="350" y="135" width="140" height="44" rx="4" stroke-width="0.5"/><text class="th" x="420" y="149" text-anchor="middle" dominant-baseline="central">Features</text><text class="ts" x="420" y="167" text-anchor="middle" dominant-baseline="central">of the signal known</text></g>
<g class="c-purple"><rect x="350" y="210" width="140" height="44" rx="4" stroke-width="0.5"/><text class="th" x="420" y="224" text-anchor="middle" dominant-baseline="central">Full waveform</text><text class="ts" x="420" y="242" text-anchor="middle" dominant-baseline="central">known</text></g>
<!-- leaves -->
<g class="c-teal"><rect x="520" y="10" width="150" height="44" rx="4" stroke-width="2"/><text class="th" x="595" y="24" text-anchor="middle" dominant-baseline="central">Energy detection</text><text class="ts" x="595" y="42" text-anchor="middle" dominant-baseline="central">needs noise power</text></g>
<g class="c-gray"><rect x="520" y="60" width="150" height="44" rx="4" stroke-width="0.5"/><text class="th" x="595" y="74" text-anchor="middle" dominant-baseline="central">Eigenvalue-based</text><text class="ts" x="595" y="92" text-anchor="middle" dominant-baseline="central">correlated samples</text></g>
<g class="c-gray"><rect x="520" y="110" width="150" height="44" rx="4" stroke-width="0.5"/><text class="th" x="595" y="124" text-anchor="middle" dominant-baseline="central">Cyclostationary</text><text class="ts" x="595" y="142" text-anchor="middle" dominant-baseline="central">cyclic frequencies</text></g>
<g class="c-teal"><rect x="520" y="160" width="150" height="44" rx="4" stroke-width="2"/><text class="th" x="595" y="174" text-anchor="middle" dominant-baseline="central">Waveform-based</text><text class="ts" x="595" y="192" text-anchor="middle" dominant-baseline="central">known sequence</text></g>
<g class="c-gray"><rect x="520" y="210" width="150" height="44" rx="4" stroke-width="0.5"/><text class="th" x="595" y="224" text-anchor="middle" dominant-baseline="central">Matched filter</text><text class="ts" x="595" y="242" text-anchor="middle" dominant-baseline="central">demodulation</text></g>
<!-- legend -->
<g class="c-teal"><rect x="362" y="304" width="26" height="16" stroke-width="2"/></g>
<text class="ts" x="398" y="312" dominant-baseline="central">Implemented in this study</text>
<g class="c-gray"><rect x="362" y="334" width="26" height="16" stroke-width="0.5"/></g>
<text class="ts" x="398" y="342" dominant-baseline="central">Reviewed only</text>
<g class="c-gray"><rect x="362" y="364" width="26" height="16" stroke-width="1" style="stroke-dasharray:5 3"/></g>
<text class="ts" x="398" y="372" dominant-baseline="central">Outside the scope</text>
</svg>
